<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="prismRadialGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="75%" stop-color="#0f172a" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Squircle Deep Obsidian Gradient -->
    <linearGradient id="squircleBgPrism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322"/>
      <stop offset="50%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Bezel Gradient -->
    <linearGradient id="prismBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6264a7"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Beam Gradients -->
    <!-- Teams Beam (Center to Top-Left) -->
    <linearGradient id="beamTeams" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#6264a7"/>
      <stop offset="100%" stop-color="#7b83eb"/>
    </linearGradient>

    <!-- Moodle Beam (Center to Top-Right) -->
    <linearGradient id="beamMoodle" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <!-- Untis Beam (Center to Straight Down) -->
    <linearGradient id="beamUntis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#f58220"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#squircleBgPrism)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#prismRadialGlow)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="url(#prismBezel)" stroke-width="2.5" stroke-opacity="0.45"/>

  <!-- Subtle Ambient Concentric Background Halo -->
  <circle cx="256" cy="235" r="160" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.12" stroke-dasharray="8 6"/>
  <circle cx="256" cy="235" r="105" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.18"/>

  <!-- 3 Laser Energy Beams Connecting Prism Core to Logos -->
  <!-- 1. Top-Left: Towards Microsoft Teams -->
  <line x1="217" y1="212" x2="117" y2="155" stroke="url(#beamTeams)" stroke-width="5" stroke-linecap="round" filter="url(#laserGlow)"/>
  <line x1="217" y1="212" x2="117" y2="155" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <!-- 2. Top-Right: Towards Moodle -->
  <line x1="295" y1="212" x2="395" y2="155" stroke="url(#beamMoodle)" stroke-width="5" stroke-linecap="round" filter="url(#laserGlow)"/>
  <line x1="295" y1="212" x2="395" y2="155" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <!-- 3. Straight Down: Towards WebUntis Clock -->
  <line x1="256" y1="280" x2="256" y2="395" stroke="url(#beamUntis)" stroke-width="5" stroke-linecap="round" filter="url(#laserGlow)"/>
  <line x1="256" y1="280" x2="256" y2="395" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <!-- Central Quantum Prism Crystal (Centered at 256, 235) -->
  <g id="centerPrism">
    <!-- Outer Inverted Crystal Triangle -->
    <polygon points="217,212.5 295,212.5 256,280" fill="#0d1424" stroke="#00f2fe" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Facet 1: Top (Indigo Reflection) -->
    <polygon points="217,212.5 295,212.5 256,235" fill="#1e2438" stroke="#6264a7" stroke-width="1.5" stroke-opacity="0.7"/>
    
    <!-- Facet 2: Left (Cyan / Teams Glass) -->
    <polygon points="217,212.5 256,280 256,235" fill="#132338" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.8"/>
    
    <!-- Facet 3: Right (Warm Orange / Untis Glass) -->
    <polygon points="295,212.5 256,280 256,235" fill="#241a28" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.8"/>

    <!-- Brilliant Radiant Crystal Core Pulse -->
    <circle cx="256" cy="235" r="10" fill="#00f2fe" filter="url(#coreGlow)"/>
    <circle cx="256" cy="235" r="5" fill="#ffffff"/>
  </g>

  <!-- ======================================================== -->
  <!-- CORNER BADGE 1: MICROSOFT TEAMS (Top-Left: 117, 155)    -->
  <!-- ======================================================== -->
  <g transform="translate(117, 155)" filter="url(#badgeShadow)">
    <!-- Outer Halo Ring -->
    <circle cx="0" cy="0" r="28" fill="#141829" stroke="#6264a7" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="24" fill="#1e2238"/>
    
    <!-- Teams Background Overlapping Card -->
    <rect x="-10" y="-14" width="22" height="22" rx="5" fill="#464eb8"/>
    <circle cx="1" cy="-7" r="4.5" fill="#7b83eb"/>
    <path d="M -5 3 C -5 -2, 7 -2, 7 3 Z" fill="#7b83eb"/>

    <!-- Foreground Teams "T" Card -->
    <rect x="-16" y="-8" width="22" height="22" rx="5" fill="#505ac9" stroke="#7b83eb" stroke-width="1"/>
    <!-- Bold White 'T' -->
    <text x="-5" y="8" fill="#ffffff" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="16" text-anchor="middle">T</text>
  </g>

  <!-- ======================================================== -->
  <!-- CORNER BADGE 2: MOODLE (Top-Right: 395, 155)            -->
  <!-- ======================================================== -->
  <g transform="translate(395, 155)" filter="url(#badgeShadow)">
    <!-- Outer Halo Ring -->
    <circle cx="0" cy="0" r="28" fill="#1a1410" stroke="#f97316" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="24" fill="#2d1c12"/>
    
    <!-- Moodle Orange Badge (Size: 32x30) -->
    <rect x="-16" y="-15" width="32" height="30" rx="8" fill="#f98012"/>

    <!-- Graduation Cap (Mortarboard) -->
    <!-- Diamond Cap Top -->
    <polygon points="0,-13 11,-8 0,-3 -11,-8" fill="#1e293b"/>
    <!-- Cap Under-Band -->
    <path d="M -6 -7 L -6 -4 C -6 -1, 6 -1, 6 -4 L 6 -7 Z" fill="#0f172a"/>
    <!-- Tassel -->
    <path d="M 0 -8 L 12 -4 L 12 1" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Moodle 'm' Letter -->
    <text x="0" y="10" fill="#ffffff" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="18" text-anchor="middle">m</text>
  </g>

  <!-- ======================================================== -->
  <!-- CORNER BADGE 3: UNTIS MOBILE CLOCK (Straight Down: 256, 395) -->
  <!-- ======================================================== -->
  <g transform="translate(256, 395)" filter="url(#badgeShadow)">
    <!-- Outer Halo Ring (Identical to Teams & Moodle) -->
    <circle cx="0" cy="0" r="28" fill="#1a140d" stroke="#f58220" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="24" fill="#261b12"/>
    
    <!-- Untis Orange App Badge (Identical Size to Moodle: 32x30, rx: 8) -->
    <rect x="-16" y="-15" width="32" height="30" rx="8" fill="#f58220"/>

    <!-- White Circular Clock Face centered inside Untis badge -->
    <circle cx="0" cy="0" r="12" fill="#ffffff"/>

    <!-- Clock Hour Ticks (Subtle Dark Gray) -->
    <!-- 9 o'clock -->
    <line x1="-11" y1="0" x2="-9" y2="0" stroke="#555a60" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 10:30 (Up-Left) -->
    <line x1="-7.8" y1="-7.8" x2="-6.4" y2="-6.4" stroke="#555a60" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 7:30 (Down-Left) -->
    <line x1="-7.8" y1="7.8" x2="-6.4" y2="6.4" stroke="#555a60" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 6 o'clock -->
    <line x1="0" y1="11" x2="0" y2="9" stroke="#555a60" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 4:30 (Down-Right) -->
    <line x1="7.8" y1="7.8" x2="6.4" y2="6.4" stroke="#555a60" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Subtle Material Drop Shadow under hands -->
    <polygon points="0,0 7,7 11,7 11,0 0,-9" fill="#000000" fill-opacity="0.12"/>

    <!-- 1. Blue Hand (Straight UP to 12:00) with pointed pencil tip -->
    <polygon points="-1.5,0 -1.5,-7.5 0,-10 1.5,-7.5 1.5,0" fill="#1b68db"/>

    <!-- 2. Red Hand (Diagonally UP-RIGHT to 1:30 / 45°) with pointed pencil tip -->
    <g transform="rotate(45)">
      <polygon points="-1.5,0 -1.5,-6.5 0,-8.8 1.5,-6.5 1.5,0" fill="#ea4335"/>
    </g>

    <!-- 3. Yellow/Gold Hand (Straight RIGHT to 3:00) with pointed pencil tip -->
    <polygon points="0,-1.5 7.5,-1.5 10,0 7.5,1.5 0,1.5" fill="#fbbc04"/>
  </g>
</svg>